# ai-cli pane state tracking (@ai_cli / @ai_state, set by the `ai` wrapper
# and the ai-mark-busy/ai-mark-blocked/ai-stop-notify hooks):
#
# - When focus lands on a blocked/done pane, dismiss its pending
#   notification (if any) and clear it back to idle - whether the user got
#   here by clicking the notification or navigating there directly.
set-hook -g pane-focus-in 'run-shell -b "ai-pane-focus-clear #{q:pane_id} #{q:@ai_state} #{q:@ai_notif_id}"'
# - Once the ai cli exits, clear all markers so a plain shell left behind
#   doesn't keep showing stale state/coloring.
set-hook -g pane-exited 'run-shell -b "ai-pane-exited-cleanup #{q:pane_id}"'

set -g pane-border-style "fg=colour238 bg=default"
set -g pane-active-border-style "fg=blue bg=default"
# Title background reflects focus only (thm_blue when pane_active),
# independent of ai-cli state. When @ai_cli is set, a status label plus a
# colored dot (●) is appended after the title: busy=yellow, blocked=red,
# done=green, idle (state cleared but ai-cli still running)=blue.
set -g pane-border-format '#{?pane_active,#[fg=#{@thm_crust}]#[bg=#{@thm_blue}]#[bold] #P #{?window_zoomed_flag,#[fg=#f5a97f]󰁌 #[fg=#{@thm_crust}]#[bg=#{@thm_blue}],}#{?pane_title,#{pane_title},#{pane_current_command}} #{?@ai_cli,#{?@ai_state,[#{@ai_state}],[idle]} }#[default],#[bold] #P#{?window_zoomed_flag,#[fg=#f5a97f]󰁌 #[default],} #[default]#{?pane_title,#{pane_title},#{pane_current_command}}#{?@ai_cli, #{?@ai_state,[#{@ai_state}],[idle]}} }#{?@ai_cli,#[fg=#{@thm_fg}] #[fg=#{?#{==:#{@ai_state},busy},yellow,#{?#{==:#{@ai_state},blocked},red,#{?#{==:#{@ai_state},done},green,blue}}}]●#[default]  ,}'
set -g pane-border-status top

##### TPM init #####

run '~/.tmux/plugins/tpm/tpm'

# ── Smarter smart-splits navigation ──────────────────────────────
# Override smart-splits.nvim bindings to also verify that vim is
# actually running (pane_current_command), not just relying on the
# @pane-is-vim option. This prevents getting stuck after nvim crashes:
# once @pane-is-vim is stuck at 1, the fallback check against the real
# process name still routes to select-pane correctly.
#
bind-key -n M-h if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-h' \
    "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -n M-j if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-j' \
    "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n M-k if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-k' \
    "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -n M-l if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-l' \
    "if -F '#{pane_at_right}' '' 'select-pane -R'"
# Same for resize keys (M-H, M-J, M-K, M-L)
bind-key -n M-H if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-H' \
    'resize-pane -L 3'
bind-key -n M-J if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-J' \
    'resize-pane -D 3'
bind-key -n M-K if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-K' \
    'resize-pane -U 3'
bind-key -n M-L if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-L' \
    'resize-pane -R 3'

# Override tmux-yank's wl-copy bindings to use set-clipboard (OSC52) instead.
unbind-key -n C-y
bind-key -n M-y copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Escape send-keys -X cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
