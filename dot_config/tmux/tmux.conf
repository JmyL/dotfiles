set -g automatic-rename off
# set -g automatic-rename-format '#{b:pane_current_path}'
set -g @catppuccin_window_text "#[fg=#6e738d] #W"
set -g @catppuccin_window_current_text "#[fg=#ffffff] #W"
# Make the active window stand out more strongly.
set -g @catppuccin_window_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_red}"
