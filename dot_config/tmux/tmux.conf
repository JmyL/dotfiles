# prefix
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# mouse
set -g mouse on

# terminal
set -g default-terminal "tmux-256color"
# set -sa terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"

# split shortcuts
bind | split-window -h
bind - split-window -v
bind-key -n 'M-x' split-window -h -c "#{pane_current_path}"
bind-key -n 'M-d' split-window -v -c "#{pane_current_path}"
bind-key -n 'M-t' new-window -c "#{pane_current_path}"
bind-key -n 'M-w' confirm-before -p "Kill window #W? (y/n)" "kill-window"
bind-key -n 'C-PgDn' next-window
bind-key -n 'C-PgUp' previous-window
bind-key -n 'M-z' resize-pane -Z

# popup UI
set -g @popup_ui_bg "#363a4f"
set -g @popup_ui_fg "#cad3f5"
set -g @popup_ui_border_fg "#f5bde6"
set -g @popup_ui_border_bg "#363a4f"
bind-key -n 'M-r' command-prompt -I "#W" -p "Ren?ame window:" "rename-window '%%'"
# bind-key -n 'M-R' command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"
bind-key -n 'M-R' source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

unbind '"'
unbind %

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# session shortcuts
bind C command-prompt -p "New session name:" "new-session -A -s '%%'"

# Save session

# indexing
set -g base-index 1
setw -g pane-base-index 1

# window navigation
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

# easier copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi _ send-keys -X start-of-line

# status
set -g status-position top

# Host-local overrides. Server/default: show system info; local can disable it in ~/.config/tmux/tmux.local.
set -g @show_system_stats 1
set -g @show_uptime 1
set -g @show_date_time 1
set -g @show_battery 1
source-file -q ~/.config/tmux/tmux.local

# Pi
set -g allow-passthrough on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-kitty:extkeys,clipboard'
# set -as terminal-features 'xterm*:extkeys'


##### TPM #####
