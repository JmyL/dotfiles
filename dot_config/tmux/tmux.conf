set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# set -g @plugin 'fcsonline/tmux-thumbs'
# run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
# bind-key -n m-Y thumbs-pick

set -g @plugin 'Morantron/tmux-fingers'
bind -n M-Y run -b "#{@fingers-cli} start #{pane_id}"

# set -g @plugin 'tomis007/tpluck'
# run-shell ~/.tmux/plugins/tpluck/tpluck.tmux

# Splits
set -g @plugin 'mrjones2014/smart-splits.nvim'
# Optional configurations with their default values if omitted:
set -g @smart-splits_no_wrap '1' # to disable wrapping. (any value disables wrapping)
set -g @smart-splits_move_left_key  'M-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'M-j' #  --"--
set -g @smart-splits_move_up_key    'M-k' #  --"--
set -g @smart-splits_move_right_key 'M-l' #  --"--
set -g @smart-splits_resize_left_key  'M-H' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-J' #  --"--
set -g @smart-splits_resize_up_key    'M-K' #  --"--
set -g @smart-splits_resize_right_key 'M-L' #  --"--
set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# Directional pane swaps. In Neovim, use C-M-h/j/k/l; at a Neovim edge
# it calls the same script to swap tmux panes. Outside Neovim, the same keys swap tmux panes.
smart_splits_swap_vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
smart_splits_swap_is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${smart_splits_swap_vim_pattern}$'"
bind-key -n C-M-h if-shell "$smart_splits_swap_is_vim" { send-keys C-M-h } { run-shell swap-pane-direction\ left }
bind-key -n C-M-j if-shell "$smart_splits_swap_is_vim" { send-keys C-M-j } { run-shell swap-pane-direction\ down }
bind-key -n C-M-k if-shell "$smart_splits_swap_is_vim" { send-keys C-M-k } { run-shell swap-pane-direction\ up }
bind-key -n C-M-l if-shell "$smart_splits_swap_is_vim" { send-keys C-M-l } { run-shell swap-pane-direction\ right }

# Session Manager
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @sessionx-bind 'p'

# Floating scratch shell. Close with Escape, C-c, exit, or C-d.
bind-key -n M-n display-popup -d "#{pane_current_path}" -w 80% -h 80% -E -b rounded -s "fg=#{@popup_ui_fg},bg=#{@popup_ui_bg}" -S "fg=#{@popup_ui_border_fg},bg=#{@popup_ui_border_bg}" 'ai-monitor --popup'
bind-key -n M-N display-popup -d "#{pane_current_path}" -w 80% -h 80% -E

bind-key -n "M-p" run-shell "sesh last || tmux display-message -d 1000 'Only one session'"
bind-key -n "M-q" confirm-before -p "Kill session #S? (y/n)" "run-shell 'tmux-kill-current-session #{q:session_id}'"
bind-key -n "M-O" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key -n M-o run-shell 'tmuxinator-project-list | fzf-tmux -p 80%,70% \
  --no-sort --ansi --border-label " tmuxinator " --prompt "⚡  " \
  --header="Enter connect ^e edit ^y copy ^r rename ^x delete" \
  --with-nth=1,2.. \
  --bind "enter:become(sesh connect {2})" \
  --bind "ctrl-e:become(tmuxinator-edit-session {2})" \
  --bind "ctrl-y:execute(tmuxinator-project-action copy {2})+reload(tmuxinator-project-list)" \
  --bind "ctrl-r:execute(tmuxinator-project-action rename {2})+reload(tmuxinator-project-list)" \
  --bind "ctrl-x:execute(tmuxinator-project-action delete {2})+reload(tmuxinator-project-list)" \
  --preview-window "right:55%" \
  --preview "tmuxinator-project-preview {2}" || true'

bind-key -n M-s run-shell 'tmuxinator-save-session-notify #{q:session_name} #{q:client_tty}'

# clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_use_osc52 on

# utilities
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

##### theme #####
