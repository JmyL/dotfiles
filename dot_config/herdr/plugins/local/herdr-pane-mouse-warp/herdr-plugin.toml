id = "herdr-pane-mouse-warp"
name = "Herdr Pane Mouse Warp"
version = "0.3.4"
min_herdr_version = "0.7.3"
description = "Warp the Sway pointer into the focused Herdr pane (alt+space), including when focus returns to Kitty."
platforms = ["linux"]

[[actions]]
id = "warp"
title = "Warp pointer into focused pane"
command = ["./herdr-warp-on-focus"]

[[events]]
on = "pane.focused"
command = ["./herdr-warp-on-focus"]
