# A project is a herdr workspace template. Save one *.toml file per project in
# ~/.config/herdr-plus/projects/ — the file name does not matter.
#
# Opening a project (the Projects action — bind a key to it, see the README)
# creates a new herdr workspace rooted at `working_dir`, labeled `name`, with one
# tab per [[tabs]] entry (in order). Each tab runs its `command` on startup; omit
# `command` for an empty terminal.

name = "nvim"
description = "neovim configuration editing & managing"
group = "default"                                      # optional: cluster a client's projects under a heading
working_dir = "~/.config/nvim"   # ~ and $VARS expand

[[tabs]]
name = "nvim"

[[tabs.panes]]
command = "nvim"

[[tabs.panes]]
command = "codex"
split = "right"
