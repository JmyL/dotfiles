# Shared Herdr Splits settings.
# Set to false if you want Herdr panes to stay zoomed when moving/resizing.
unzoom_on_nav=true
nav_left_key=alt+h
nav_down_key=alt+j
nav_up_key=alt+k
nav_right_key=alt+l
resize_left_key=alt+shift+h
resize_down_key=alt+shift+j
resize_up_key=alt+shift+k
resize_right_key=alt+shift+l
