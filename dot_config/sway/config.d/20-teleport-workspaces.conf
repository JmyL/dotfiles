# Local rddev teleport windows (Xwayland). Titles come from the SDL view
# names; secondary dashboard is the Electron kiosk on :7313.
assign [class="^teleport$" title="^front_view$"] workspace number 7
assign [class="^teleport$" title="^left_view$"] workspace number 8
assign [class="^teleport$" title="^right_view$"] workspace number 9
assign [class="^ree-secondary-dashboard-browser$"] workspace number 10

for_window [class="^teleport$" title="^front_view$"] move container to workspace number 7
for_window [class="^teleport$" title="^left_view$"] move container to workspace number 8
for_window [class="^teleport$" title="^right_view$"] move container to workspace number 9
for_window [class="^ree-secondary-dashboard-browser$"] move container to workspace number 10
