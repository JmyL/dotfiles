# Export Wayland/Sway environment to D-Bus and systemd user services.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway XDG_SESSION_DESKTOP=sway DESKTOP_SESSION=sway
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP DESKTOP_SESSION

# Start graphical-session.target so systemd user units bound to it (waybar,
# mako, xdg-desktop-portal, ...) can actually run under sway.
exec systemctl --user start sway-session.target
