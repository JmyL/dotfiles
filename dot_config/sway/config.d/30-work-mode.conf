# Work testbed / VPN mode. Scripts live under ~/.local/bin/work/.
# Restart the reservation watcher after reboot (state is on disk; the pid is not).
exec sh -c 'test -x "$HOME/.local/bin/work/ree-reserve" && "$HOME/.local/bin/work/ree-reserve" resume'
# Floating log for $mod+w g / Waybar VPN click (launcher focuses a browser workspace first).
for_window [app_id="ree-goodmorning"] floating enable, sticky enable, border none, resize set 900 480, move position center
set $work_mode Work: [g]oodmorning [r]eservation [d]eploy [s]ession [q]uit
set $work_reserve_mode Reservation: [s]tart [c]ancel
set $work_session_mode Session: [s]tart [c]ancel
mode "$work_mode" {
    bindsym g mode "default", exec $HOME/.local/bin/work/ree-goodmorning-launch
    bindsym r mode "$work_reserve_mode"
    bindsym d mode "default", exec $HOME/.local/bin/work/ree-deploy --detach --ask
    bindsym s mode "$work_session_mode"
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym q mode "default"
}
mode "$work_reserve_mode" {
    bindsym s mode "default", exec $HOME/.local/bin/work/ree-reserve start --detach --pick
    bindsym c mode "default", exec $HOME/.local/bin/work/ree-reserve cancel
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym q mode "default"
}
mode "$work_session_mode" {
    bindsym s mode "default", exec $HOME/.local/bin/work/ree-reserve session
    bindsym c mode "default", exec $HOME/.local/bin/work/ree-reserve session-stop
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym q mode "default"
}
bindsym $mod+w mode "$work_mode"
