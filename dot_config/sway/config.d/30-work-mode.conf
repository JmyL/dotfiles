# Work testbed / VPN mode. Scripts live under ~/.local/bin/work/.
# Restart the reservation watcher after reboot (state is on disk; the pid is not).
exec sh -c 'test -x "$HOME/.local/bin/work/ree-reserve" && "$HOME/.local/bin/work/ree-reserve" resume'
set $work_mode Work: [g]oodmorning [r]eserve [x]cancel [d]eploy [s]ession [q]uit
mode "$work_mode" {
    bindsym g mode "default", exec foot --app-id=ree-goodmorning --title=goodmorning -e $HOME/.local/bin/work/ree-goodmorning
    bindsym r mode "default", exec $HOME/.local/bin/work/ree-reserve start --detach --pick
    bindsym x mode "default", exec sh -c 'choice=$(printf "Cancel reservation\nKeep\n" | $HOME/.local/bin/fzf-menu --prompt "Cancel reservation? "); [ "$choice" = "Cancel reservation" ] && $HOME/.local/bin/work/ree-reserve cancel'
    bindsym d mode "default", exec $HOME/.local/bin/work/ree-deploy --detach --ask
    bindsym s mode "default", exec $HOME/.local/bin/work/ree-reserve session
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym q mode "default"
}
bindsym $mod+w mode "$work_mode"
