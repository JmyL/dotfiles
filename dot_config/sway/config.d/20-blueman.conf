# Keep blueman-applet running for the whole Sway session.
# Without this, blueman-manager cold-starts the applet on every open; the
# applet's TransferService can block on OBEX D-Bus long enough that
# GetBluetoothStatus times out and the manager crashes.
exec sh -c 'command -v blueman-applet >/dev/null 2>&1 && blueman-applet'
