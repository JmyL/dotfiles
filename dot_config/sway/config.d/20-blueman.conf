# Keep blueman-applet running for the whole Sway session.
# Without this, blueman-manager cold-starts the applet on every open.
#
# Disable TransferService (OBEX file transfer): unused here, and its sync
# OBEX ObjectManager call times out at session start and trips Apport.
exec sh -c 'command -v blueman-applet >/dev/null 2>&1 || exit 0; python3 -c "from gi.repository import Gio; s = Gio.Settings.new(\"org.blueman.general\"); p = [x for x in s[\"plugin-list\"] if x not in (\"TransferService\", \"!TransferService\")]; p.append(\"!TransferService\"); s[\"plugin-list\"] = p" 2>/dev/null || true; exec blueman-applet'
