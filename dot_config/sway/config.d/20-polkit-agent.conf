# Start a polkit authentication agent if one is installed.
exec sh -c 'for agent in /usr/libexec/polkit-gnome-authentication-agent-1 /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 /usr/libexec/lxqt-policykit-agent /usr/libexec/polkit-kde-authentication-agent-1; do [ -x "$agent" ] && exec "$agent"; done'
