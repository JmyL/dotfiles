# Prefer external for every workspace. Disabled eDP still counts as present,
# so listing it first parks new 6-10 workspaces on a black laptop panel and
# the window vanishes from Sway (vdrive_vnc m2 / workspace 8).
# sway-rebalance-workspaces moves 6-10 onto eDP when both outputs are on.
# Fallbacks keep workspaces usable with one output.
workspace 1 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 2 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 3 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 4 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 5 output HDMI-A-1 DP-1 DP-2 eDP-1

workspace 6 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 7 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 8 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 9 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 10 output HDMI-A-1 DP-1 DP-2 eDP-1

# After reload, wait for kanshi to settle before moving already-open workspaces.
exec_always sh -c 'sleep 0.7; exec "$HOME/.local/bin/sway-rebalance-workspaces"'
