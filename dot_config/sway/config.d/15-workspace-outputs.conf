# Prefer external as main (1-5) and laptop as secondary (6-10).
# When only one output is active, the listed fallbacks keep workspaces usable.
# Rebalance after reload / display toggles moves already-open workspaces.
workspace 1 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 2 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 3 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 4 output HDMI-A-1 DP-1 DP-2 eDP-1
workspace 5 output HDMI-A-1 DP-1 DP-2 eDP-1

workspace 6 output eDP-1 HDMI-A-1 DP-1 DP-2
workspace 7 output eDP-1 HDMI-A-1 DP-1 DP-2
workspace 8 output eDP-1 HDMI-A-1 DP-1 DP-2
workspace 9 output eDP-1 HDMI-A-1 DP-1 DP-2
workspace 10 output eDP-1 HDMI-A-1 DP-1 DP-2

# After reload, wait for kanshi to settle before moving already-open workspaces.
exec_always sh -c 'sleep 0.7; exec "$HOME/.local/bin/sway-rebalance-workspaces"'
