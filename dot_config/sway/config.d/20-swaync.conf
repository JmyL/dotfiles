# Notification daemon and notification center.
# Prefer ~/.local/bin (meson --prefix=$HOME/.local) over apt /usr/bin.
# On Sway reload: start swaync if dead; if already running, reload config/CSS
# instead of kill+restart (avoids a D-Bus name race that aborts with SIGABRT).
# systemd unit stays masked.
exec_always sh -c 'bin="$HOME/.local/bin/swaync"; [ -x "$bin" ] || bin=$(command -v swaync) || exit 0; client="$HOME/.local/bin/swaync-client"; [ -x "$client" ] || client=swaync-client; if pgrep -x swaync >/dev/null 2>&1; then "$client" -R -rs -sw >/dev/null 2>&1 || true; exit 0; fi; exec "$bin"'
