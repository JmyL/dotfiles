# Notification daemon and notification center.
# On Sway reload: start swaync if dead; if already running, reload config/CSS
# instead of kill+restart (avoids a D-Bus name race that aborts with SIGABRT).
# systemd unit stays masked.
exec_always sh -c 'command -v swaync >/dev/null 2>&1 || exit 0; if pgrep -x swaync >/dev/null 2>&1; then swaync-client -R -rs -sw >/dev/null 2>&1 || true; exit 0; fi; exec swaync'
