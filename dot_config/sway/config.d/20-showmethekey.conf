# Show Me The Key's keys window is a normal GTK toplevel, not a layer-shell
# overlay. "Clickable" is its drag handle, not a second dialog.
# app_id is the GApplication id; older docs still say showmethekey-gtk.
for_window [app_id="one.alynx.showmethekey"] {
    floating enable
}

for_window [app_id="showmethekey-gtk"] {
    floating enable
}

for_window [app_id="one.alynx.showmethekey" title="Floating Window - Show Me The Key"] {
    sticky enable
    exec $HOME/.local/bin/sway-place-showmethekey
}

for_window [app_id="showmethekey-gtk" title="Floating Window - Show Me The Key"] {
    sticky enable
    exec $HOME/.local/bin/sway-place-showmethekey
}
