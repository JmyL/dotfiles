# On-screen display daemon for volume and brightness keys.
# On Sway reload: start if missing; restart only if the client D-Bus name is gone.
exec_always sh -c 'command -v swayosd-server >/dev/null 2>&1 || exit 0; if pgrep -x swayosd-server >/dev/null 2>&1 && busctl --user status org.erikreider.swayosd-server >/dev/null 2>&1; then exit 0; fi; killall -w -q swayosd-server 2>/dev/null || true; exec swayosd-server'
