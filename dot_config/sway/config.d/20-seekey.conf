# Seekey prefers wlr-layer-shell (bottom + style.align). If that fails it
# becomes a normal GTK window; pin that fallback to the bottom center.
for_window [app_id="dev.seekey"] {
    floating enable
    sticky enable
    exec $HOME/.local/bin/sway-place-showmethekey --app-id dev.seekey --width 720 --height 160
}
