# Binds are of the form <key sequence> = <command to run>
# To use '=' in a key sequence, substitute it with "Eq": "<Ctrl+Eq>"
# If you wish to bind #, you can wrap the key sequence in quotes: "#" = quit
<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>
<C-t> = :term<Enter>

[messages]
<C-r> = :check-mail<Enter>
j = :next<Enter>
<Down> = :next<Enter>
<C-d> = :next 50%<Enter>
<C-f> = :next 100%<Enter>
<PgDn> = :next -s 100%<Enter>

k = :prev<Enter>
<Up> = :prev<Enter>
<C-u> = :prev 50%<Enter>
<C-b> = :prev 100%<Enter>
<PgUp> = :prev -s 100%<Enter>
g = :select 0<Enter>
G = :select -1<Enter>

J = :next-folder<Enter>
K = :prev-folder<Enter>

v = :mark -t<Enter>
V = :mark -v<Enter>
<Space> = :mark -t<Enter>:next<Enter>
<Esc> = :unmark -a<Enter>:clear<Enter>

T = :toggle-threads<Enter> # Toggle threaded view
zc = :fold<Enter> # Close fold
zo = :unfold<Enter> # Open fold
za = :fold -t<Enter> # Alternate/toggle fold
zM = :fold -a<Enter> # More folded: close all folds
zR = :unfold -a<Enter> # Reduce folds: open all folds
<tab> = :fold -t<Enter> # Alternate/toggle fold

<Enter> = :view<Enter>
o = :view<Enter>
d = :prompt 'Really delete this message?' 'delete-message'<Enter>
D = :delete<Enter>
A = :archive flat<Enter>

C = :compose<Enter>

rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

c = :cf<space>
$ = :term<space>
| = :pipe<space>

/ = :search<space>
\ = :filter<space>
n = :next-result<Enter>
N = :prev-result<Enter>

Sc = :sort -r date<Enter>
Ss = :sort -r size<Enter>

[view]
q = :close<Enter>
| = :pipe<space>
D = :delete<Enter>
A = :archive flat<Enter>
I = :archive flat<Enter>
a = :archive flat<Enter>

f = :forward<Enter>
rr = :reply -a<Enter>
rq = :reply -aq<Enter>
Rr = :reply<Enter>
Rq = :reply -q<Enter>

H = :toggle-headers<Enter>
o = :open<Enter>
! = :flag -t -x flagged<Enter>
<C-k> = :prev-part<Enter>
<C-j> = :next-part<Enter>
J = :next<Enter>
K = :prev<Enter>

[compose]
# Keybindings used when the embedded terminal is not selected in the compose
# view
$ex = <C-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<tab> = :next-field<Enter>

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <C-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>

[compose::review]
# Keybindings used when reviewing a message to be sent
y = :send<Enter>
n = :abort<Enter>
p = :postpone<Enter>
q = :abort<Enter>
e = :edit<Enter>
a = :attach<space>

[terminal]
$noinherit = true
$ex = <C-x>

<C-h> = :prev-tab<Enter>
<C-l> = :next-tab<Enter>
