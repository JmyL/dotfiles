# Wait for the session env import (sd-wait-session-env) before starting.
# An early D-Bus activation otherwise starts the portal before
# sway-start-session imports WAYLAND_DISPLAY/XDG_CURRENT_DESKTOP: the first
# instance then reads portal conf without the desktop id (Settings falls back
# to a dead gtk portal -> 25 s activation timeouts for every GTK app).
[Service]
ExecStart=
ExecStart=/home/sungsik/.local/bin/sd-wait-session-env /usr/libexec/xdg-desktop-portal
