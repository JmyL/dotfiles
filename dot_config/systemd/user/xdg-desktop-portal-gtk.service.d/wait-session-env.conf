# Wait for the session env import (sd-wait-session-env) before starting.
# Without WAYLAND_DISPLAY this portal dies instantly with "cannot open
# display", stays failed, and blocks portal Settings/Access/FileChooser
# resolution for the whole login.
[Service]
ExecStart=
ExecStart=/home/sungsik/.local/bin/sd-wait-session-env /usr/libexec/xdg-desktop-portal-gtk
