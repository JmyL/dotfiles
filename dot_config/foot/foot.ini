# Floating pickers / clipse — match kitty font_size 11 + JetBrainsMonoNL
[main]
font=JetBrainsMonoNL Nerd Font Mono:size=11
dpi-aware=no
pad=8x8 center

[colors]
# Semi-transparent background for the floating pickers
alpha=0.85

[colors-dark]
# Close to kitty/Catppuccin-ish dark used elsewhere
foreground=cdd6f4
background=1e1e2e
