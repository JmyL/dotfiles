[general]
duration-ms=1200
typing-idle-ms=650
fade-ms=180
margin=0
margin-horizontal=0
max-items=5
window-width=720
window-height=160
layer-shell=auto
typing-display=full
merge-repeats=true
merge-modifiers=true
show-mouse=false
theme=catppuccin

[style]
align=center
disappear=fade
spacing=7
overlay-padding=12
key-min-width=0
key-padding-x=14
key-padding-y=8
key-radius=12
key-border-width=1
key-font-px=20
key-font-weight=700
typing-max-width=480
font-family=inherit
foreground=#f5e0dc
background=alpha(#585b70, 0.94)
border-color=alpha(#cba6f7, 0.72)
shadow=0 7px 22px alpha(#000000, 0.38)
placeholder-text=Seekey
placeholder-foreground=alpha(#cdd6f4, 0.72)
placeholder-background=alpha(#585b70, 0.64)
placeholder-border-color=alpha(#cba6f7, 0.52)
