# prefix
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# mouse
set -g mouse on

# terminal
set -g default-terminal "tmux-256color"
# set -sa terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"

# split shortcuts
bind | split-window -h
bind - split-window -v
bind-key -n 'M-x' split-window -h -c "#{pane_current_path}"
bind-key -n 'M-d' split-window -v -c "#{pane_current_path}"
bind-key -n 'C-t' new-window -c "#{pane_current_path}"
# bind-key -n 'C-w' kill-window
bind-key -n 'C-PgDn' next-window
bind-key -n 'C-PgUp' previous-window
bind-key -n 'M-z' resize-pane -Z
bind-key -n 'M-o' next-layout
bind-key -n 'M-n' command-prompt -p 'rename window:' 'rename-window "%%"'

unbind '"'
unbind %

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# session shortcuts
bind C command-prompt -p "new session name:" "new-session -A -s '%%'"

# Save session
# bind-key -n M-s confirm-before -p 'Save tmuxp session to #{pane_current_path}/.tmuxp.yaml? (y/n)' 'run-shell "tmuxp freeze --force -y -q \"#{session_name}\" -o \"#{pane_current_path}/.tmuxp.yaml\" && tmux display-message \"Saved tmuxp session to #{pane_current_path}/.tmuxp.yaml\""'
# bind-key -n M-S confirm-before -p 'Save tmuxp session to ~/.tmuxp/#{session_name}.yaml? (y/n)' 'run-shell "mkdir -p ~/.tmuxp && tmuxp freeze --force -y -q \"#{session_name}\" -o \"$HOME/.tmuxp/#{session_name}.yaml\" && tmux display-message \"Saved tmuxp session to ~/.tmuxp/#{session_name}.yaml\""'

# indexing
set -g base-index 1
setw -g pane-base-index 1

# window navigation
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

# easier copy mode
setw -g mode-keys vi

# status
set -g status-position top

# Host-local overrides. Server/default: show uptime; local can disable it in ~/.tmux.local.
set -g @show_uptime 1
source-file -q ~/.tmux.local

# Pi
set -g allow-passthrough on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-kitty:extkeys,clipboard'
# set -as terminal-features 'xterm*:extkeys'


##### TPM #####
# Run git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Splits
set -g @plugin 'mrjones2014/smart-splits.nvim'
# Optional configurations with their default values if omitted:
set -g @smart-splits_no_wrap '1' # to disable wrapping. (any value disables wrapping)
set -g @smart-splits_move_left_key  'M-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'M-j' #  --"--
set -g @smart-splits_move_up_key    'M-k' #  --"--
set -g @smart-splits_move_right_key 'M-l' #  --"--
set -g @smart-splits_resize_left_key  'M-H' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-J' #  --"--
set -g @smart-splits_resize_up_key    'M-K' #  --"--
set -g @smart-splits_resize_right_key 'M-L' #  --"--
set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# Directional pane swaps. In Neovim, use C-M-h/j/k/l; at a Neovim edge
# it calls the same script to swap tmux panes. Outside Neovim, the same keys swap tmux panes.
smart_splits_swap_vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
smart_splits_swap_is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${smart_splits_swap_vim_pattern}$'"
bind-key -n C-M-h if-shell "$smart_splits_swap_is_vim" { send-keys C-M-h } { run-shell ~/.tmux/scripts/swap-pane-direction\ left }
bind-key -n C-M-j if-shell "$smart_splits_swap_is_vim" { send-keys C-M-j } { run-shell ~/.tmux/scripts/swap-pane-direction\ down }
bind-key -n C-M-k if-shell "$smart_splits_swap_is_vim" { send-keys C-M-k } { run-shell ~/.tmux/scripts/swap-pane-direction\ up }
bind-key -n C-M-l if-shell "$smart_splits_swap_is_vim" { send-keys C-M-l } { run-shell ~/.tmux/scripts/swap-pane-direction\ right }

# Session Manager
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @sessionx-bind 'p'
# set -g @sessionx-tmuxinator-mode 'on'
# set -g @sessionx-bind-tmuxinator-list 'M-t'

# resurrect (session save/load)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# save: M-s, restore: M-S (prefix sequence kept: prefix Ctrl-s / Ctrl-r)
bind-key -n M-s if-shell -F '#{==:#{session_name},0}' \
  "run-shell -b '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'" \
  "display-message 'Save blocked: It's not a home session(0)'"
bind-key -n M-r run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"

# clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_use_osc52 on

# utilities
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

##### theme #####
# set -g @plugin 'janoamaral/tokryo-night-tmux'
set -g automatic-rename off
# set -g automatic-rename-format '#{b:pane_current_path}'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "macchiato"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "default"

set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "yes" # yes, no
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
%if "#{==:#{@show_uptime},1}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
%endif
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"

##### TPM init #####

run '~/.tmux/plugins/tpm/tpm'

# ── Smarter smart-splits navigation ──────────────────────────────
# Override smart-splits.nvim bindings to also verify that vim is
# actually running (pane_current_command), not just relying on the
# @pane-is-vim option. This prevents getting stuck after nvim crashes:
# once @pane-is-vim is stuck at 1, the fallback check against the real
# process name still routes to select-pane correctly.
#
bind-key -n M-h if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-h' \
    "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -n M-j if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-j' \
    "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n M-k if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-k' \
    "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -n M-l if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-l' \
    "if -F '#{pane_at_right}' '' 'select-pane -R'"
# Same for resize keys (M-H, M-J, M-K, M-L)
bind-key -n M-H if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-H' \
    'resize-pane -L 3'
bind-key -n M-J if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-J' \
    'resize-pane -D 3'
bind-key -n M-K if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-K' \
    'resize-pane -U 3'
bind-key -n M-L if -F '#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}' \
    'send-keys M-L' \
    'resize-pane -R 3'

# Override tmux-yank's wl-copy bindings to use set-clipboard (OSC52) instead.
bind-key -n M-y copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Escape send-keys -X cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
