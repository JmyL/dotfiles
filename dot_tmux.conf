# prefix
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# mouse
set -g mouse on

# terminal
set -g default-terminal "tmux-256color"
# set -sa terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"

# split shortcuts
bind | split-window -h
bind - split-window -v
bind-key -n 'M-x' split-window -h -c "#{pane_current_path}"
bind-key -n 'M-d' split-window -v -c "#{pane_current_path}"
bind-key -n 'M-t' new-window -c "#{pane_current_path}"

unbind '"'
unbind %

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# session shortcuts
bind C command-prompt -p "new session name:" "new-session -A -s '%%'"

# pane navigation
# Disable wrap-around for vim-tmux-navigator when not inside vim/nvim.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'M-h' if-shell "$is_vim" { send-keys M-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n 'M-j' if-shell "$is_vim" { send-keys M-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n 'M-k' if-shell "$is_vim" { send-keys M-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n 'M-l' if-shell "$is_vim" { send-keys M-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }
bind-key -T copy-mode-vi 'M-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'M-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'M-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi 'M-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind-key -n 'M-H' if-shell "$is_vim" { send-keys M-H } { resize-pane -L 5 }
bind-key -n 'M-J' if-shell "$is_vim" { send-keys M-J } { resize-pane -D 5 }
bind-key -n 'M-K' if-shell "$is_vim" { send-keys M-K } { resize-pane -U 5 }
bind-key -n 'M-L' if-shell "$is_vim" { send-keys M-L } { resize-pane -R 5 }

# indexing
set -g base-index 1
setw -g pane-base-index 1

# window navigation
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9

# easier copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# status
set -g status-position top

# Pi
set -g extended-keys-format csi-u
set -g extended-keys on

##### TPM #####
# Run git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 's'
set -g @resurrect-restore 'r'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-processes '"~pi->pi -c"'
set -g @continuum-restore 'on'

# clipboard
set -g @plugin 'tmux-plugins/tmux-yank'


##### theme #####

set -g @plugin 'janoamaral/tokyo-night-tmux'

##### TPM init #####

run '~/.tmux/plugins/tpm/tpm'

